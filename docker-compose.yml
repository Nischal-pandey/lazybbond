services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lazybond
      POSTGRES_USER: lazybond
      POSTGRES_PASSWORD: lazybond
    ports:
      - "5432:5432"
    volumes:
      - lazybond-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazybond -d lazybond"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lazybond-postgres:
